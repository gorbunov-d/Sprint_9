name: Sprint 9 Selenium
on:
  push:
    paths-ignore:
      - "README.md"
      - "artifacts/**"
      - "allure-report/**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download Chrome for Selenoid
        run: docker pull selenoid/vnc_chrome:128.0
      - name: Build and run tests
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests
      - name: Set up Node for Allure
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java for Allure
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Allure report
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" allure-results
          npx --yes allure-commandline@2.32.0 generate allure-results --clean -o allure-report
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error
      - name: Show container logs
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
