name: sprint9
services:
  selenoid:
    image: aerokube/selenoid:1.11.3
    platform: linux/amd64
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./selenoid/browsers.json:/etc/selenoid/browsers.json:ro
    command: ["-conf", "/etc/selenoid/browsers.json", "-container-network", "sprint9", "-limit", "2", "-service-startup-timeout", "120s"]
    ports:
      - "127.0.0.1:4444:4444"
    networks: [browser]
  tests:
    build: .
    depends_on: [selenoid]
    environment:
      BASE_URL: ${BASE_URL:-https://foodgram-frontend-1.foodgram.education-services.ru}
      SELENOID_URL: http://selenoid:4444/wd/hub
      BROWSER_VERSION: ${BROWSER_VERSION:-}
    volumes:
      - ${ALLURE_RESULTS_DIR:-./allure-results}:/app/allure-results
    entrypoint: ["python", "scripts/run_tests.py"]
    networks: [browser]
networks:
  browser:
    name: sprint9
